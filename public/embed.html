<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:absolute;inset:0;width:100%;height:100%}</style>
</head>
<body>
<!-- Standard YouTube player, unmodified: nothing is drawn over it.
     This page only relays player events to the Little Screen app. -->
<div id="p"></div>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
const videoId = /^[\w-]{11}$/.test(qs.get("v") || "") ? qs.get("v") : "";
const parentOrigin = qs.get("parent") || "";
const okParent = /^(capacitor:\/\/localhost|https?:\/\/localhost(:\d+)?|https:\/\/[\w.-]+(:\d+)?)$/.test(parentOrigin) || parentOrigin === location.origin;
const tell = (type, data) => { if (okParent && window.parent !== window) window.parent.postMessage({ src: "ls-embed", type, data }, parentOrigin); };
let player;
window.onYouTubeIframeAPIReady = () => {
  if (!videoId) return tell("error", 2);
  player = new YT.Player("p", {
    host: "https://www.youtube-nocookie.com",
    videoId,
    playerVars: { autoplay: 1, playsinline: 1, rel: 0, fs: 1, iv_load_policy: 3, origin: location.origin },
    events: {
      onReady: () => tell("ready"),
      onStateChange: e => tell("state", e.data),
      onError: e => tell("error", e.data)
    }
  });
};
window.addEventListener("message", e => {
  if (e.origin !== parentOrigin || !player || e.data?.src !== "ls-app") return;
  if (e.data.cmd === "pause") player.pauseVideo?.();
  if (e.data.cmd === "play") player.playVideo?.();
});
const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
s.onerror = () => tell("blocked");
document.head.appendChild(s);
</script>
</body>
</html>
