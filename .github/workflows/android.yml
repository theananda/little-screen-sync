# Builds the Little Screen Android app on GitHub's servers.
# Run it from the repo's Actions tab → "Build Android app" → Run workflow.
# Download the result from the finished run's "Artifacts" section.
#
# Always produces:  little-screen-debug-apk   (install directly on a phone for testing)
# If signing secrets are set (see README), also: little-screen-release  (signed .apk + .aab for Google Play)

name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["public/app/**", "public/base.css", "mobile/**", ".github/workflows/android.yml"]

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LS_API: ${{ vars.LS_API || 'https://kids.springsprouts.net' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install and prepare the app
        working-directory: mobile
        run: |
          npm install
          npm run build:web
          npx cap add android
          npm run assets
          npx cap sync android

      - name: Set version number
        working-directory: mobile/android
        run: |
          # versionCode goes up by one on every run; Google Play needs it to keep increasing.
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"2.0.${{ github.run_number }}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build test APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v6
        with:
          name: little-screen-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release (only when signing secrets are set)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - uses: actions/upload-artifact@v6
        if: ${{ env.KEYSTORE_B64 != '' }}
        with:
          name: little-screen-release
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
