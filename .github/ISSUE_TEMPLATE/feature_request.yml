name: Feature idea
description: Suggest something that would make Little Screen better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project
      options:
        - label: Doesn't add ads, tracking, or data collection from children
          required: true
